name: Q-Bridge Gateway CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      # sq-claims: every security / hardware / measurement claim lives in
      # _marketing/claims.yaml with evidence paths that must exist.
      - name: Claim registry check (_marketing/claims.yaml)
        run: python3 scripts/claims-check .

      # /health version contract: gateway_agent.__version__ == pyproject == CHANGELOG head == /health
      - name: Version contract (/health == __version__ == pyproject == CHANGELOG head)
        env:
          ENVIRONMENT: test
        run: |
          python - <<'PY'
          import re
          from fastapi.testclient import TestClient
          import gateway_agent
          from gateway_agent.server import GatewayServer
          v = gateway_agent.__version__
          py = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          log = re.search(r"v(\d+\.\d+\.\d+)", open("CHANGELOG.md", encoding="utf-8").read(400)).group(1)
          h = TestClient(GatewayServer().app).get("/health").json()
          print("health", h.get("version"), "__version__", v, "pyproject", py, "changelog", log)
          assert h.get("version") == v == py == log, "version contract broken"
          PY

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff black mypy

      - name: Lint with ruff
        run: ruff check gateway_agent/

      - name: Check formatting with black
        run: black --check gateway_agent/ tests/

      - name: Type check with mypy
        run: mypy gateway_agent/ --ignore-missing-imports

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qbridge-gateway:test .

      - name: Verify container starts
        run: |
          docker run -d --name test-container -p 8090:8090 qbridge-gateway:test
          sleep 5
          docker logs test-container
          docker stop test-container
          docker rm test-container
